experiment:
  name: partial_finetune_echoprime_ef
  seed: 42
data:
  root: data/EchoNet-Dynamic
  target: EF
model:
  embedding_dim: 512
  hidden_dim: 128
  dropout: 0.10
  unfreeze_last_blocks: 1
training:
  batch_size: 4
  epochs: 20
  encoder_learning_rate: 0.00001
  head_learning_rate: 0.0005
  weight_decay: 0.0001
  early_stopping_patience: 5
output:
  dir: outputs/partial_finetune_echoprime_ef
